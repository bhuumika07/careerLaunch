<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <!-- Sand-toned outer glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feFlood flood-color="#C4A885" flood-opacity="0.65" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feFlood flood-color="#C4A885" flood-opacity="0.45" result="glowColor" />
      <feComposite in="glowColor" in2="blur" operator="in" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Upward Energy Streams & Radiating Rays -->
  <g stroke="#E8DFD4" stroke-width="0.8" opacity="0.3" stroke-linecap="round">
    <!-- Radiating background celebration burst from center of cup -->
    <line x1="200" y1="120" x2="200" y2="12" stroke-dasharray="3 4" />
    <line x1="200" y1="120" x2="245" y2="18" />
    <line x1="200" y1="120" x2="155" y2="18" />
    <line x1="200" y1="120" x2="290" y2="35" stroke-dasharray="4 4" />
    <line x1="200" y1="120" x2="110" y2="35" stroke-dasharray="4 4" />
    <line x1="200" y1="120" x2="335" y2="65" />
    <line x1="200" y1="120" x2="65" y2="65" />
    <line x1="200" y1="120" x2="365" y2="110" stroke-dasharray="2 4" />
    <line x1="200" y1="120" x2="35" y2="110" stroke-dasharray="2 4" />

    <!-- Upward rising dashed guideline tracks -->
    <line x1="75" y1="360" x2="75" y2="160" stroke-dasharray="3 6" />
    <line x1="325" y1="360" x2="325" y2="160" stroke-dasharray="3 6" />
  </g>

  <!-- Decorative Upward-Pointing Arrows, Confetti & Geometric Sparkles (Cream #E8DFD4) -->
  <g id="celebration-accents">
    <!-- Prominent Grand Star Above Trophy -->
    <g transform="translate(200, 38)" filter="url(#glow-subtle)">
      <!-- 8-point faceted star -->
      <polygon points="0,-18 4,-5 18,0 4,5 0,18 -4,5 -18,0 -4,-5" fill="#22343D" stroke="#E8DFD4" stroke-width="1.2" />
      <polygon points="0,-18 3,-4 0,0 -3,-4" fill="#C4A885" fill-opacity="0.4" />
      <polygon points="18,0 4,3 0,0 4,-3" fill="#C4A885" fill-opacity="0.4" />
      <polygon points="0,18 -3,4 0,0 3,4" fill="#C4A885" fill-opacity="0.4" />
      <polygon points="-18,0 -4,-3 0,0 -4,3" fill="#C4A885" fill-opacity="0.4" />
      <circle cx="0" cy="0" r="2.2" fill="#E8DFD4" />
    </g>

    <!-- Flanking 4-point sparkle stars -->
    <!-- Top Left Star -->
    <path d="M 80,44 L 83,52 L 91,55 L 83,58 L 80,66 L 77,58 L 69,55 L 77,52 Z" fill="#22343D" stroke="#E8DFD4" stroke-width="1" />
    <!-- Top Right Star -->
    <path d="M 320,44 L 323,52 L 331,55 L 323,58 L 320,66 L 317,58 L 309,55 L 317,52 Z" fill="#22343D" stroke="#E8DFD4" stroke-width="1" />

    <!-- Mid-level stars -->
    <path d="M 44,142 L 46,147 L 51,149 L 46,151 L 44,156 L 42,151 L 37,149 L 42,147 Z" fill="#C4A885" opacity="0.8" />
    <path d="M 356,142 L 358,147 L 363,149 L 358,151 L 356,156 L 354,151 L 349,149 L 354,147 Z" fill="#C4A885" opacity="0.8" />

    <!-- Upward-Pointing Chevrons (Progress & Growth symbols) -->
    <!-- Left column chevrons -->
    <g stroke="#E8DFD4" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <polyline points="72,195 80,185 88,195" />
      <polyline points="74,188 80,180 86,188" opacity="0.5" />

      <polyline points="72,250 80,240 88,250" />
      <line x1="80" y1="240" x2="80" y2="260" stroke-width="1.1" stroke-dasharray="2 3" />

      <!-- Right column chevrons -->
      <polyline points="312,195 320,185 328,195" />
      <polyline points="314,188 320,180 326,188" opacity="0.5" />

      <polyline points="312,250 320,240 328,250" />
      <line x1="320" y1="240" x2="320" y2="260" stroke-width="1.1" stroke-dasharray="2 3" />

      <!-- Lower accent arrows -->
      <polyline points="98,312 104,304 110,312" opacity="0.7" />
      <polyline points="290,312 296,304 302,312" opacity="0.7" />
    </g>

    <!-- Geometric Confetti & Shards -->
    <!-- Triangles -->
    <polygon points="106,85 114,80 112,92" stroke="#C4A885" stroke-width="1" fill="#22343D" fill-opacity="0.25" />
    <polygon points="294,85 286,80 288,92" stroke="#C4A885" stroke-width="1" fill="#22343D" fill-opacity="0.25" />
    <polygon points="62,88 68,98 56,96" stroke="#E8DFD4" stroke-width="1" fill="#22343D" fill-opacity="0.2" />
    <polygon points="338,88 332,98 344,96" stroke="#E8DFD4" stroke-width="1" fill="#22343D" fill-opacity="0.2" />
    <polygon points="85,125 92,132 82,135" stroke="#C4A885" stroke-width="1" fill="#22343D" fill-opacity="0.2" />
    <polygon points="315,125 308,132 318,135" stroke="#C4A885" stroke-width="1" fill="#22343D" fill-opacity="0.2" />

    <!-- Fluttering diamonds / quadrilaterals -->
    <polygon points="142,42 148,46 144,54 138,50" fill="#E8DFD4" opacity="0.7" />
    <polygon points="258,42 252,46 256,54 262,50" fill="#E8DFD4" opacity="0.7" />
    <polygon points="58,225 64,228 61,236 55,233" fill="#C4A885" opacity="0.7" />
    <polygon points="342,225 336,228 339,236 345,233" fill="#C4A885" opacity="0.7" />
    <polygon points="68,285 73,288 70,295 65,292" fill="#E8DFD4" opacity="0.6" />
    <polygon points="332,285 327,288 330,295 335,292" fill="#E8DFD4" opacity="0.6" />

    <!-- Ambient sparkle dots -->
    <circle cx="120" cy="62" r="1.5" fill="#E8DFD4" opacity="0.8" />
    <circle cx="280" cy="62" r="1.5" fill="#E8DFD4" opacity="0.8" />
    <circle cx="50" cy="180" r="1.5" fill="#C4A885" />
    <circle cx="350" cy="180" r="1.5" fill="#C4A885" />
    <circle cx="92" cy="225" r="1.2" fill="#E8DFD4" />
    <circle cx="308" cy="225" r="1.2" fill="#E8DFD4" />
    <circle cx="48" cy="340" r="1.5" fill="#E8DFD4" opacity="0.6" />
    <circle cx="352" cy="340" r="1.5" fill="#E8DFD4" opacity="0.6" />
  </g>

  <!-- Low-Poly Trophy Pedestal / Base Structure (Sand strokes & subtle slate fills) -->
  <g id="trophy-base">
    <!-- Lowest Plinth (Tier 1 - Ground Platform) -->
    <!-- Front bevel facets -->
    <polygon points="128,368 272,368 266,356 134,356" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.28" />
    <polygon points="128,368 134,356 142,356 134,368" stroke="#C4A885" stroke-width="1.1" stroke-linejoin="round" fill="#22343D" fill-opacity="0.38" />
    <polygon points="272,368 266,356 258,356 266,368" stroke="#C4A885" stroke-width="1.1" stroke-linejoin="round" fill="#22343D" fill-opacity="0.20" />
    <polygon points="134,356 266,356 254,344 146,344" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.18" />

    <!-- Pedestal Middle Block (Tier 2 - Award Plaque Section) -->
    <!-- Left face bevel -->
    <polygon points="146,344 158,306 174,306 166,344" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.35" />
    <!-- Center plaque face -->
    <polygon points="166,344 174,306 226,306 234,344" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.16" />
    <!-- Right face bevel -->
    <polygon points="234,344 226,306 242,306 254,344" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.24" />

    <!-- Pedestal Face Award Plaque Wireframe Emblem -->
    <g stroke="#C4A885" stroke-width="1" opacity="0.8">
      <rect x="178" y="314" width="44" height="22" rx="2" stroke="#E8DFD4" fill="#22343D" fill-opacity="0.25" />
      <!-- Star on plaque -->
      <polygon points="200,318 202,323 207,323 203,326 205,331 200,328 195,331 197,326 193,323 198,323" fill="#C4A885" stroke="none" />
    </g>

    <!-- Pedestal Collar / Inward Taper to Stem (Tier 3) -->
    <polygon points="158,306 174,306 186,282 176,282" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.22" />
    <polygon points="174,306 226,306 214,282 186,282" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.12" />
    <polygon points="226,306 242,306 224,282 214,282" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.30" />

    <!-- Stem Column Knop / Fluted Column Rings -->
    <polygon points="176,282 186,282 188,252 182,252" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.26" />
    <polygon points="186,282 214,282 212,252 188,252" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.14" />
    <polygon points="214,282 224,282 218,252 212,252" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.32" />

    <!-- Stem Knop Ring / Flare to Bowl Base -->
    <polygon points="182,252 218,252 222,242 178,242" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.25" />
    <polygon points="178,242 222,242 216,232 184,232" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.18" />
  </g>

  <!-- Low-Poly Wireframe Cup & Handles (With Glow Filter applied to Cup portion) -->
  <g id="trophy-cup" filter="url(#glow)">
    <!-- Lower Chalice Bowl Facets (Rising from stem knop y=232) -->
    <polygon points="184,232 200,232 200,214 178,210" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.18" />
    <polygon points="184,232 178,210 162,204" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.28" />
    <polygon points="200,232 216,232 222,210 200,214" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.12" />
    <polygon points="216,232 238,204 222,210" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.22" />

    <!-- Mid Chalice Bowl Facets (y=204 to y=156) -->
    <polygon points="162,204 178,210 168,166 142,162" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.24" />
    <polygon points="178,210 200,214 200,170 168,166" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.14" />
    <polygon points="200,214 222,210 232,166 200,170" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.10" />
    <polygon points="222,210 238,204 258,162 232,166" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.20" />

    <!-- Upper Chalice Flare Facets (y=162 to y=118) -->
    <polygon points="142,162 168,166 162,122 126,118" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.26" />
    <polygon points="168,166 200,170 200,126 162,122" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.12" />
    <polygon points="200,170 232,166 238,122 200,126" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.08" />
    <polygon points="232,166 258,162 274,118 238,122" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.18" />

    <!-- Rim Collar Facets (y=118 to Top Rim) -->
    <polygon points="126,118 162,122 160,94 114,88" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.22" />
    <polygon points="162,122 200,126 200,98 160,94" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.10" />
    <polygon points="200,126 238,122 240,94 200,98" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.06" />
    <polygon points="238,122 274,118 286,88 240,94" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.16" />

    <!-- Cup Rim Front Arc Facets -->
    <polygon points="114,88 138,98 168,104 160,94" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.30" />
    <polygon points="160,94 168,104 200,106 200,98" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.15" />
    <polygon points="200,98 200,106 232,104 240,94" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.12" />
    <polygon points="240,94 232,104 262,98 286,88" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.25" />

    <!-- Cup Rim Back & Interior Cavity (Darker slate depth) -->
    <polygon points="114,88 152,78 200,74 160,94" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.45" />
    <polygon points="160,94 200,74 248,78 240,94" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.40" />
    <polygon points="240,94 248,78 286,88" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.48" />

    <!-- Left Sweeping Low-Poly Handle -->
    <!-- Outer ribbon facets -->
    <polygon points="114,88 78,98 56,124 82,126" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.22" />
    <polygon points="114,88 126,118 82,126" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.14" />
    <polygon points="56,124 48,158 72,156 82,126" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.28" />
    <polygon points="48,158 56,188 88,180 72,156" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.32" />
    <polygon points="56,188 84,204 142,192 88,180" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.25" />
    <polygon points="88,180 142,192 162,204" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.15" />

    <!-- Right Sweeping Low-Poly Handle -->
    <!-- Outer ribbon facets -->
    <polygon points="286,88 322,98 344,124 318,126" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.18" />
    <polygon points="286,88 274,118 318,126" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.12" />
    <polygon points="344,124 352,158 328,156 318,126" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.24" />
    <polygon points="352,158 344,188 312,180 328,156" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.28" />
    <polygon points="344,188 316,204 258,192 312,180" stroke="#C4A885" stroke-width="1.3" stroke-linejoin="round" fill="#22343D" fill-opacity="0.20" />
    <polygon points="312,180 258,192 238,204" stroke="#C4A885" stroke-width="1.2" stroke-linejoin="round" fill="#22343D" fill-opacity="0.12" />

    <!-- Highlight Nodes on Rim & Handle Vertices -->
    <circle cx="114" cy="88" r="2" fill="#E8DFD4" />
    <circle cx="286" cy="88" r="2" fill="#E8DFD4" />
    <circle cx="200" cy="98" r="2.2" fill="#E8DFD4" />
    <circle cx="56" cy="124" r="2" fill="#E8DFD4" />
    <circle cx="344" cy="124" r="2" fill="#E8DFD4" />
    <circle cx="48" cy="158" r="2" fill="#E8DFD4" />
    <circle cx="352" cy="158" r="2" fill="#E8DFD4" />
    <circle cx="200" cy="170" r="2.5" fill="#E8DFD4" />
    <circle cx="200" cy="214" r="2" fill="#E8DFD4" />
  </g>
</svg>
